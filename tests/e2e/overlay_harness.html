<!DOCTYPE html>
<html lang="en">
<!--
  Overlay (heatmap) render harness for the Phase 3.2 Playwright safety net.

  The heatmap/player overlay does NOT render on an OWA report page. In production
  the report page links to base.overlayLauncher, which redirects the browser to
  the *tracked* page (the customer's own site) with a

      #owa_overlay.<base64(urlencode(JSON))>

  URL anchor. On that tracked page the OWA tracker bundle runs, and its
  Tracker.checkForOverlaySession() decodes the anchor and calls
  OWA_instance.startOverlaySession(), which dynamic-imports Heatmap.js and calls
  generate() -> showControlPanel() (builds #owa_overlay + controls) and
  createCanvas() (appends #owa_heatmap). All of that DOM is built through
  jQuery 3.x (the tracker path is already on 3.x).

  This file stands in for that tracked page. It is served SAME-ORIGIN with the
  live OWA install (tests/ is under the webroot), so:
    - the real modules/base/dist/owa.tracker.js loads with no CORS issues, and
    - webpack's automatic publicPath resolves the owa.heatmap.js import chunk
      relative to the bundle, exactly as in production.

  The test only asserts the deterministic, synchronous part of the render (the
  jQuery-built control panel + canvas). The subsequent click-data fetch is an
  async JSONP call whose payload depends on live data, so it is intentionally
  not part of the assertion -- it cannot fail the "does jQuery 3.x still build
  the overlay DOM" contract this test exists to protect.

  owa_baseUrl is injected by the test via a query param so this file has no
  hard-coded host.
-->
<head>
    <meta charset="UTF-8">
    <title>OWA overlay render harness</title>
</head>
<body>
    <!-- Some page content so the heatmap canvas has non-zero document dimensions. -->
    <div style="height: 800px; width: 600px;">
        <h1>OWA overlay test page</h1>
        <p>Synthetic tracked page for the heatmap overlay Playwright test.</p>
        <a id="a-link" href="#">a link</a>
    </div>

    <script>
        // Resolve the OWA install base URL from ?base=... (test injects it).
        (function () {
            var params = new URLSearchParams(window.location.search);
            var base = params.get('base');
            if (!base) {
                throw new Error('overlay_harness.html requires a ?base=<owa public url> query param');
            }
            // Trailing slash normalization -- owa_baseUrl is expected with one.
            if (base.charAt(base.length - 1) !== '/') {
                base += '/';
            }
            window.owa_baseUrl = base;

            // Build the overlay anchor the way base.overlayLauncher does:
            //   value = base64( JSON.stringify(params) ), placed after
            //   "#owa_overlay." (the tracker splits the fragment on "," then ".").
            // The tracker decodes with base64_decode(urldecode(value)). OWA's
            // urldecode replaces "+" with a space, so a raw base64 string
            // containing "+" would be corrupted; percent-encoding the base64
            // (encodeURIComponent) is what survives that urldecode intact -- the
            // decode path is built to reverse a url-encoded base64.
            var overlayParams = {
                action: 'loadHeatmap',
                // A well-formed but deliberately unreachable API url. The heatmap
                // builds its control panel + canvas BEFORE the first data fetch,
                // and the fetch is JSONP (no CORS error, just never calls back),
                // so an unresolved fetch does not affect what we assert.
                api_url: base + 'api/?owa_do=base.reportHeatmap',
                document_id: 'e2e-overlay-doc'
            };
            var encoded = encodeURIComponent(btoa(JSON.stringify(overlayParams)));
            // Set the fragment BEFORE the tracker bundle loads so
            // checkForOverlaySession() (run from the Tracker constructor) sees it.
            window.location.hash = 'owa_overlay.' + encoded;

            // Bootstrap the tracker exactly like js_log_tag.tpl does.
            window.owa_cmds = window.owa_cmds || [];
            window.owa_cmds.push(['setSiteId', 'e2e-overlay-harness']);

            var _owa = document.createElement('script');
            _owa.type = 'text/javascript';
            _owa.async = true;
            _owa.src = window.owa_baseUrl + 'modules/base/dist/owa.tracker.js';
            var _owa_s = document.getElementsByTagName('script')[0];
            _owa_s.parentNode.insertBefore(_owa, _owa_s);
        }());
    </script>
</body>
</html>
