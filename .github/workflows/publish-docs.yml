name: Publish reference documentation

# On the release being PUBLISHED, not on it being packaged.
#
# The Release Packager opens a DRAFT, which a person publishes by hand and may
# decide not to publish at all. Generating the wiki from the packager would
# therefore document a release that does not exist yet, and sometimes one that
# never will. `published` fires at the moment the release becomes public, which
# is exactly when the wiki should start describing it.
#
# Deliberately not on push to master either: the wiki documents the released
# version, so it must not move every time a metric is registered.
on:
  release:
    types: [published]
  # Re-run against an existing tag if a publish failed or the page was edited by
  # hand. Generates from the tag given, so it cannot quietly document master.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to generate from (e.g. 2.0.0)
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Regenerate the reference sections of the wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the released code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Production dependencies only. The generator reads the registries, which
      # need the autoloader but no database -- it pre-defines OWA_DB_TYPE so it
      # boots without a config file.
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Check out the wiki
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki

      # Only the text between a page's named BEGIN/END GENERATED markers is
      # replaced; the rest of each page is written by hand. A marker naming a
      # section that does not exist fails the run rather than leaving a page
      # stale. The 1.x pages use the unnamed marker and are left alone.
      - name: Regenerate the marked sections
        run: php tests/tools/wiki/generate.php --wiki /tmp/wiki

      - name: Commit, if anything changed
        working-directory: /tmp/wiki
        run: |
          if git diff --quiet; then
            echo "The wiki already matches this release. Nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Regenerate reference sections for ${{ github.event.inputs.tag || github.event.release.tag_name }}"
          git push
