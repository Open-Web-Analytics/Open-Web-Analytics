name: CI
on:
  push:
    branches: [ master ]
  pull_request:

# One run per branch. Pushing again while a run is in flight cancels the older
# one, which is almost always what you want while iterating on a pull request --
# and it stops superseded runs sitting on the runners. Three hung e2e jobs on
# commits that had already been replaced once queued everything else in the
# repository behind them for over an hour.
#
# master is excluded from cancellation: its runs are the record of what the
# default branch does, so they finish even if another merge lands behind them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Lint, analyse & test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # Observed around 1m15s. A ceiling this far above it only ever trips on a
    # hang, never on a slow runner.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint (php -l)
        run: composer run-script lint

      - name: Static analysis (PHPStan — Core/)
        run: composer run-script phpstan

      # Whole-tree class resolution. This existed as a composer script but was
      # never wired into CI, so a dropped alias or a rename that de-synced a file
      # from its class could only be caught by someone running it locally.
      - name: Static analysis (PHPStan — whole tree)
        run: composer run-script phpstan:migration

      # Templates: catches a template reading a view var nothing sets. Neither
      # gate above can see it -- the first covers 8 Core/ files, the second runs
      # at level 0, which does not report undefined variables.
      - name: Static analysis (PHPStan — templates)
        run: composer run-script phpstan:templates

      - name: Unit tests (PHPUnit)
        run: composer run-script test

  js:
    name: Tracker JS tests (Jest)
    runs-on: ubuntu-latest
    # Observed around 35s.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build the reporting bundle so the reporting build-integrity / jsdom
      # load tests (tests/js/reporting/*) run for real instead of skipping.
      - name: Build JS bundles
        run: npm run build

      - name: JS unit tests (Jest — tracker + reporting bundle)
        run: npm test

  isolation:
    name: Test isolation sweep (each file alone, ${{ matrix.db_driver }})
    runs-on: ubuntu-latest
    # Observed between 1m38s and 3m23s.
    timeout-minutes: 20
    # A test that passes in the suite but fails alone is inheriting state an
    # earlier test set up -- a registry the dispatcher builds lazily, or a legacy
    # owa_* alias that only exists once something has autoloaded it. PHPUnit runs
    # the whole suite in one process, so neither is visible in a normal run.
    # This job is deterministic where randomised ordering is not.
    #
    # It is also where both database drivers are proven. PDO is the default
    # wherever pdo_mysql is present, but mysqli remains supported until v2, and
    # an installation without pdo_mysql falls back to it -- so a suite that only
    # ever ran on one of them would let the other rot silently while still being
    # what some installations use. 'mysql' selects PDO, 'mysqli' names the
    # legacy driver explicitly; the harness writes the choice into the scratch
    # config it generates.
    #
    # It needs a real database: two of the registries that have caused this are
    # only read by DB-backed cases, which skip without one.
    strategy:
      fail-fast: false
      matrix:
        db_driver: ['mysql', 'mysqli']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      OWA_E2E_DB_HOST: 127.0.0.1
      OWA_E2E_DB_PORT: '3306'
      OWA_E2E_DB_USER: root
      OWA_E2E_DB_PASSWORD: ''
      OWA_E2E_DB_NAME: owa_isolation_sweep
      OWA_E2E_DB_TYPE: ${{ matrix.db_driver }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, mysqli, pdo_mysql, gd
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Reuses the self-hosted e2e harness: it writes a scratch owa-config.php
      # and runs the real CLI installer. No web server and no Playwright -- the
      # unit suite only needs the schema and a config to connect with.
      - name: Provision a scratch install
        run: php tests/e2e/selfhost_harness.php up

      - name: Run every test file in its own process
        id: sweep
        run: |
          set -o pipefail
          composer run-script test:isolation 2>&1 | tee isolation.log

      # Put the verdict on the run summary page as well as in the job, so a
      # finding is readable without opening the log.
      - name: Report the verdict
        if: always()
        run: |
          {
            echo "## Test isolation sweep"
            echo
            if [ "${{ steps.sweep.outcome }}" = "success" ]; then
              echo "Every test file passes when run on its own."
            else
              echo "**These files pass in the suite but fail when run alone.**"
              echo "That means they depend on something an earlier test did."
              echo
              echo '```'
              sed -n '/fails on its own/,$p' isolation.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down the scratch install
        if: always()
        run: php tests/e2e/selfhost_harness.php down

  upgrade:
    name: Schema upgrade cycle (rewind, then upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # THE ONLY JOB IN WHICH THE UPDATES ACTUALLY RUN.
    #
    # Every other environment -- this workflow's unit job, the isolation sweep,
    # the e2e runner, and a developer's own box -- INSTALLS. Module::install()
    # builds every table from the current entity definitions and stamps
    # schema_version at the latest, so applyUpdates() walks a range that is
    # always empty and modules/*/Update/* is dead code under test.
    #
    # Two production failures came out of that hole in one week (Update023 and
    # Update026, both of which stopped a live upgrade dead), and both are the
    # same bug: a value that means two things, only distinguishable against a
    # database that already has a history. This job makes one -- it installs,
    # rewinds the schema through the rollbacks, and upgrades it forward again
    # with the real `cli.php cmd=update`.
    #
    # See tests/tools/upgrade_cycle.php for what is asserted and why.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      OWA_E2E_DB_HOST: 127.0.0.1
      OWA_E2E_DB_PORT: '3306'
      OWA_E2E_DB_USER: root
      OWA_E2E_DB_PASSWORD: ''
      # Must read as a scratch name: the cycle rewinds the schema, which drops
      # tables and columns, and refuses to run against anything that does not.
      OWA_E2E_DB_NAME: owa_upgrade_cycle_scratch
      OWA_E2E_DB_TYPE: mysql
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, mysqli, pdo_mysql, gd
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install, rewind, upgrade
        id: cycle
        run: |
          set -o pipefail
          composer run-script test:upgrade 2>&1 | tee upgrade.log

      # The verdict on the run summary page, so a finding is readable without
      # opening the log -- the interesting part is the last block, not the
      # hundred NOTICE lines the updates print on the way past.
      - name: Report the verdict
        if: always()
        run: |
          {
            echo "## Schema upgrade cycle"
            echo
            if [ "${{ steps.cycle.outcome }}" = "success" ]; then
              echo "The schema rewinds and rebuilds to something identical."
            else
              echo "**The upgrade path is broken.** An install upgrading from an older"
              echo "schema would hit this; a fresh install would not, which is why"
              echo "nothing else in CI notices."
              echo
              echo '```'
              sed -n '/the upgrade path is broken/,$p' upgrade.log | head -60
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E (self-hosted, php -S + MySQL)
    runs-on: ubuntu-latest
    # THE ONE THAT ACTUALLY HANGS. Observed between 4m27s and 10m25s when
    # healthy, and three times today it stopped dead inside "Install Playwright
    # Chromium + OS deps" -- a browser download plus apt, neither of ours -- and
    # sat there for hours, holding a runner and queueing every other run in the
    # repository behind it. 30 minutes turns that into a fast, legible failure.
    timeout-minutes: 30
    # A throwaway MySQL for the scratch install the self-hosted runner creates.
    # The runner CREATEs/DROPs its own scratch schema on this server; nothing here
    # is a real install, so root with an empty password is fine and matches the
    # OWA_E2E_DB_* env below.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Point selfhost_harness.php at the service DB (there is no live config in
      # CI, so it provisions everything from these). CI=true makes Playwright NOT
      # reuse an existing php -S and use the 'line' reporter.
      OWA_E2E_DB_HOST: 127.0.0.1
      OWA_E2E_DB_PORT: '3306'
      OWA_E2E_DB_USER: root
      OWA_E2E_DB_PASSWORD: ''
      OWA_E2E_DB_NAME: owa_e2e_selfhost
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, mysqli, gd
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # The tracker + reporting e2e specs load the BUILT bundles, so build them.
      - name: Build JS bundles
        run: npm run build

      # NO --with-deps. That flag runs apt-get update && apt-get install against
      # Ubuntu's archive on every run, and that apt step is what has been
      # hanging: five times in one day, latterly on every single run, stalling
      # for the full ten minutes with no output after reaching noble-security.
      # The browser download itself has never been the problem.
      #
      # The ubuntu-latest image already ships the shared libraries Chromium
      # needs, so the flag was buying a re-check of packages that are present.
      # If a future image drops one, Playwright fails immediately and loudly
      # with the missing library named -- a better failure than a ten-minute
      # stall in apt.
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      # STEP 1: exercise the INSTALLER itself (web wizard + CLI), each into its own
      # scratch DB on the service, self-served by php -S. This certifies the exact
      # install_manager::installSchema()/createAdminUser()/createDefaultSite() code
      # that the self-hosted step below relies on to provision its own install (the
      # web wizard's installBase and the CLI installCli both delegate to it), so a
      # green install run proves that provisioning is sound.
      - name: Run install-flow e2e suite (php -S)
        env:
          OWA_E2E_BASE_URL: http://127.0.0.1:8965/index.php
        run: npm run test:e2e:install

      # STEP 2: run the app-behavior suite (reporting / admin / tracker / cookie)
      # against a throwaway install the selfhost harness provisions via the CLI
      # installer + php -S. The selfhost config + harness derive their own URL
      # (127.0.0.1:8964 by default, distinct from the install suite's 8965), so no
      # OWA_E2E_BASE_URL is needed here; the job-level OWA_E2E_DB_* creds are shared.
      - name: Run self-hosted e2e suite (php -S)
        run: npm run test:e2e:selfhost

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
