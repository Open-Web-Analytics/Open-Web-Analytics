name: Release Packager
on: 
  workflow_dispatch:
    inputs:
      version:
        description: The version name of the release (e.g. 1.1.5)
        required: true
        default: ''
jobs:
  tag:
    name: Generate new release package
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
    # The branch the workflow is run on: master for a 2.x release once v2 is
    # merged into it, the 1.x branch for a 1.x release, or a hotfix branch for a
    # patch release. It checked out master whatever it was run on.
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ github.ref }}
    # create a release branch and bump version in appropriate files.
    - name: Create release branch
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git -C ./ checkout -b release-${{ env.VERSION }}
        echo changing version string in Core/Env.php
        sed -i "s/const VERSION = 'master';/const VERSION = '${{ env.VERSION }}';/" Core/Env.php
        grep -q "const VERSION = '${{ env.VERSION }}';" Core/Env.php
        echo changing version string in package.json
        sed -i 's/"version": "1.0.0",/"version": "${{ env.VERSION }}",/g' package.json
        grep -n "const VERSION" Core/Env.php
        cat ./package.json
        echo Committing local changes
        git -C ./ status
        git -C ./ add Core/Env.php
        git -C ./ add package.json
        git -C ./ commit -m "Updating version string."
        echo Pushing change into Branch
        git -C ./ push --set-upstream origin release-${{ env.VERSION }}
    # install the composer vendor directory (production deps only — keep the
    # test/static-analysis tooling in require-dev out of the shipped vendor/).
    #
    # PHP is pinned to the floor in composer.json's require ("php": ">=8.2") so the
    # packaging step runs on a supported version rather than whatever the runner
    # happens to default to. What actually holds the floor is config.platform.php in
    # composer.json, which fixes resolution regardless of the PHP in use.
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.2'
        tools: composer:v2
    - name: Install Composer Dependancies
      run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress
    # setup node and build js/asset bundles
    - name: Setup Node/npm 
      uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Build Javascript/Asset Packages
      run: |
        npm ci
        npm run build
    # Generate the release tarball, and check it holds what an installed
    # release needs to install it. The exclusions are in the script, which the
    # automatic-update end-to-end test packs its releases with too.
    - name: Generate Release Tarball
      run: bash .github/scripts/release-tarball.sh "${{ env.VERSION }}"
    # A draft release of the release branch, with the tarball attached. The tag
    # is created when the draft is published.
    - name: Create Draft Github Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ env.VERSION }}" "./owa_${{ env.VERSION }}_packaged.tar" \
          --draft \
          --target "release-${{ env.VERSION }}" \
          --title "Release ${{ env.VERSION }}" \
          --notes "Changes in this Release
         - First Change
         - Second Change"
