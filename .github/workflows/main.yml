name: Release Packager
on: 
  workflow_dispatch:
    inputs:
      version:
        description: The version name of the release (e.g. 1.1.5)
        required: true
        default: ''
jobs:
  tag:
    name: Generate new release package
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
    # The branch the workflow is run on: master for a 2.x release once v2 is
    # merged into it, the 1.x branch for a 1.x release, or a hotfix branch for a
    # patch release. It checked out master whatever it was run on.
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ github.ref }}
    # create a release branch and bump version in appropriate files.
    - name: Create release branch
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git -C ./ checkout -b release-${{ env.VERSION }}
        echo changing version string in Core/Env.php
        sed -i "s/const VERSION = 'master';/const VERSION = '${{ env.VERSION }}';/" Core/Env.php
        grep -q "const VERSION = '${{ env.VERSION }}';" Core/Env.php
        echo changing version string in package.json
        sed -i 's/"version": "1.0.0",/"version": "${{ env.VERSION }}",/g' package.json
        grep -n "const VERSION" Core/Env.php
        cat ./package.json
        echo Committing local changes
        git -C ./ status
        git -C ./ add Core/Env.php
        git -C ./ add package.json
        git -C ./ commit -m "Updating version string."
        echo Pushing change into Branch
        git -C ./ push --set-upstream origin release-${{ env.VERSION }}
    # install the composer vendor directory (production deps only — keep the
    # test/static-analysis tooling in require-dev out of the shipped vendor/).
    #
    # PHP is pinned to the floor in composer.json's require ("php": ">=8.2") so the
    # packaging step runs on a supported version rather than whatever the runner
    # happens to default to. What actually holds the floor is config.platform.php in
    # composer.json, which fixes resolution regardless of the PHP in use.
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.2'
        tools: composer:v2
    - name: Install Composer Dependancies
      run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress
    # setup node and build js/asset bundles
    - name: Setup Node/npm 
      uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Build Javascript/Asset Packages
      run: |
        npm ci
        npm run build
    # Generate a release tarball excluding files that are not needed in a distro.
    #
    # NOTE: these are exact paths rather than globs, with one deliberate exception
    # noted below. tar's --exclude wildcards match slashes, so a tidier
    # './modules/*/src' would exclude more than it looks like -- any module's src,
    # not just the one meant. modules/Base/src and modules/Domstream/src are the
    # unbuilt source; webpack compiles both into public/base/dist.
    #
    # The exception is './playwright*.config.js'. Listing the configs by exact name
    # silently missed playwright.install-nostash.config.js, which therefore shipped
    # in the 1.13.0 tarball; the glob covers the next config added too. Because '*'
    # matches slashes this would also catch a *.config.js under a directory named
    # playwright-something -- the only one is ./playwright-report, which is build
    # output and excluded in its own right anyway.
    #
    # This previously also had to protect a MaxMind reader bundled under
    # modules/MaxmindGeoip/includes/, which composer classmapped and which
    # therefore had to ship. That library is a composer dependency now, so it
    # arrives in vendor/ like everything else and no longer constrains this
    # list.
    - name: Generate Release Tarball
      run: |
        tar --directory ./ --exclude='./composer.json' --exclude='./composer.lock' --exclude='./package-lock.json' --exclude='./package.json' --exclude='./webpack.config.js' --exclude='./webpack.public-htaccess.js' --exclude='./modules/Base/src' --exclude='./modules/Domstream/src' --exclude='./node_modules' --exclude='./.build' --exclude='./.gitignore' --exclude='./.gitattributes' --exclude='./.gitconfig' --exclude='./.github' --exclude='./.git' --exclude='./tests' --exclude='./phpunit.xml' --exclude='./phpstan.neon' --exclude='./.php-cs-fixer.dist.php' --exclude='./.php-cs-fixer.cache' --exclude='./jest.config.js' --exclude='./babel.config.js' --exclude='./playwright*.config.js' --exclude='./.phpunit.cache' --exclude='./test-results' --exclude='./playwright-report' --exclude='./owa_${{ env.VERSION}}_packaged.tar' -pcvf ./owa_${{ env.VERSION}}_packaged.tar ./
    # What an installed release relies on to install this one: release.json,
    # which npm run build wrote, and updater.php. The tarball's SHA-256, which
    # GitHub records as the asset's digest, is the only proof it needs.
    - name: Check the tarball holds release.json and updater.php
      run: |
        tar -tf "./owa_${{ env.VERSION }}_packaged.tar" | grep -qx './release.json'
        tar -tf "./owa_${{ env.VERSION }}_packaged.tar" | grep -qx './updater.php'
    # A draft release of the release branch, with the tarball attached. The tag
    # is created when the draft is published.
    - name: Create Draft Github Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ env.VERSION }}" "./owa_${{ env.VERSION }}_packaged.tar" \
          --draft \
          --target "release-${{ env.VERSION }}" \
          --title "Release ${{ env.VERSION }}" \
          --notes "Changes in this Release
         - First Change
         - Second Change"
